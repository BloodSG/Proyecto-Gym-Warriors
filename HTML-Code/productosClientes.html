<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos - Cliente</title>
    <link rel="stylesheet" href="../CSS-Code/productos.css">
</head>
<body>

    <div class="app-shell">
        <aside class="sidebar">
            <a href="#" class="brand">
                <img src="../Recursos/Img_sis/LogoWarriors.svg" alt="Gym Warriors Logo">
            </a>
            <span class="sidebar-label">MENÚ PRINCIPAL</span>
            <nav class="main-nav">
                <a href="#" class="active">Productos</a>
            </nav>
            <a href="#" class="logout">Cerrar Sesión</a>
        </aside>

        <div class="main-content">
            <header class="topbar">
                <h1><span></span> Catálogo de Productos</h1>
                <div class="profile">
                    <strong></strong>
                    <span></span>
                </div>
            </header>

            <div class="content-wrap">
                <div class="cliente-container" style="max-width: 100%; margin: 0; background: transparent; border: none; padding: 0;">
                    
                    <div class="page-heading">
                        <span class="eyebrow">TIENDA Y SUPLEMENTOS</span>
                        <h1>Catálogo de Productos</h1>
                        <p>Explora nuestra selección de suplementos y accesorios diseñados para tus objetivos.</p>
                    </div>

                    <div class="cliente-filtros card" style="display: flex; gap: 12px; margin-bottom: 20px; align-items: center; padding: 15px 20px;">
                        <input type="text" id="Vuscar" placeholder="Buscar producto..." class="input-busqueda" style="flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg-elevated); color: var(--text);">
                        
                        <select class="select-categoria" id="filtro-categoria" style="padding: 10px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg-elevated); color: var(--text);">
                            <option value="">Todas las categorías</option>
                            <option value="Suplementos">Suplementos</option>
                            <option value="Equipamiento">Equipamiento</option>
                        </select>
                    </div>

                    <div class="catalogo-grid" id="catalogo" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px;">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../SCRIPT-Code/cargaCatalogo.js"></script>

    <div id="modalDetalle3" class="modal-detalle-overlay">
        <div class="modal-detalle-content" id="contenidomodaldetalle">
        </div>
    </div>

    <template id="template-producto-card">
        <div class="producto-card card" style="display: flex; flex-direction: column; justify-content: space-between; height: 100%;">
            <div>
                <img src="" alt="" class="prod-img" style="width: 100%; height: 180px; object-fit: cover; border-radius: 5px; margin-bottom: 10px;">
                <span class="producto-categoria-tag prod-categoria badge badge-vacaciones" style="margin-bottom: 8px;"></span>
                <h3 class="prod-nombre" style="font-family: 'Barlow Condensed', sans-serif; font-size: 20px; margin: 0 0 10px 0;"></h3>
            </div>
            <div>
                <p class="precio prod-precio" style="font-size: 16px; font-weight: 700; color: var(--lime); margin: 0 0 6px 0;"></p>
                <span class="stock-info prod-stock" style="display: block; font-size: 10px; color: var(--text-dim); margin-bottom: 12px;"></span>
                <a href="#" class="primary-button btn-card-accion prod-btn" style="display: block; text-align: center; text-decoration: none;">Ver Detalles</a>
            </div>
        </div>
    </template>

    <template id="template-modal-detalle">
        <div class="modal-detalle-overlay prod-modal-overlay">
            <div class="modal-detalle-content card">
                <a href="#" class="btn-cerrar-modal">&times;</a>
                
                <img src="" alt="" class="detalle-imagen prod-modal-img">
                
                <div class="detalle-info">
                    <span class="detalle-categoria prod-modal-categoria"></span>
                    <h2 class="detalle-titulo prod-modal-titulo"></h2>
                    <p class="detalle-descripcion prod-modal-desc"></p>
                    <div class="detalle-precio prod-modal-precio"></div>
                    <span class="stock-info detalle-stock prod-modal-stock"></span>
                    <div class="mt-10">
                        <button type="button" class="primary-button">Añadir al Carrito</button>
                    </div>
                </div>
            </div>
        </div>
    </template>

</body>
</html>
