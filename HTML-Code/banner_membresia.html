<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner membresía</title>
    <link rel="stylesheet" href="../CSS-Code/banner_membresia.css">
</head>
<body style="background-color: #0a0e17; padding: 20px; font-family: Inter, Arial, sans-serif;">

    <!-- por vencer -->
    <div class="banner_membresia banner_advertencia">
        <div class="banner_icono">⚠️</div>
        <div>
            <h4>¡Atención! Tu membresía está por vencer</h4>
            <p>Quedan pocos días para que venza tu membresía. No olvides realizar tu pago a tiempo.</p>
        </div>
    </div>

    <br>

    <!-- vencida -->
    <div class="banner_membresia banner_peligro">
        <div class="banner_icono">❌</div>
        <div>
            <h4>Tu membresía ha vencido</h4>
            <p>Tu acceso al gimnasio se encuentra suspendido. Realiza tu pago para reactivarlo.</p>
        </div>
    </div>

</body>
</html>
