<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Catálogo</title>
    <link rel="stylesheet" href="../CSS-Code/productos.css">
</head>
<body>

    <div class="admin-container">
        
        <h1 class="admin-titulo">PANEL DE ADMINISTRACIÓN</h1>
        <p class="admin-subtitulo">Gestión de Inventario y Productos</p>

        <form action="../PHP-Code/AgregarProducto.php" class="form-admin" id="formulario-producto"  method="post" enctype="multipart/form-data">
            <p class="form-section-title">1. Registrar Nuevo Producto</p>

            <label>
                Nombre del Producto:
                <input type="text" required placeholder="Ej. Proteína WEY" id="nombre" name="nombre">
            </label>

            <label>
                Proveedor que reparte:
                <select required id="selectproveedor" name="id_poveedor">
                    <option value="">Cargando proveedores...</option>
                </select>
            </label>

            <label>
                Categoría:
                <select required id="selectCategoriaRegistro" name="id_categoria">
                    <option value="">Cargando categorías...</option>
                </select>
            </label>

            <label>
                Descripción del producto:
                <input type="text" placeholder="Peso de 2 kilog, Sabor vainilla" id="descripcion" name="descripcion">
            </label>

            <label>
                Precio de compra ($):
                <input type="number" step="1.00" required placeholder="0.00" name="precio_compra">
            </label>

            <label>
                Precio de Venta ($):
                <input type="number" step="1.00" required placeholder="0.00" name="precio_venta">
            </label>

            <label>
                Stock Inicial:
                <input type="number" min="0" required placeholder="Cantidad" name="stock">
            </label>

            <div class="fila-inputs-img">
            <label>
                url de la imagen
                <input type="url" id="product-imagen-archivo" name="imagen_url" >
            </label>

            <label>
                seleccionar desde dispositivo
                <input type="file" id="product-imagen-url" name="imagen_archivo" accept="image/*">
            </label>
            </div>

            <button type="submit" class="btn-primary mt-10" id="guargarProducto">Guardar Producto</button>
        </form>

        <div class="tabla-contenedor"> 
            <p class="form-section-title" style="margin-bottom: 15px; font-size: 15px;">2. Inventario Actual</p>
            <table class="tabla-admin">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>P. Venta</th>
                        <th>Stock</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-contenedor">
                    <tr>
                        
                    </tr>
                </tbody>
            </table>
        </div><script type="module" src="../SCRIPT-Code/editaCatalogo.js"></script>

    </div>

    <div class="modal-overlay" id="modalEditarOverlay">
        <div class="modal-content" id="modalEditar">
        </div>
    </div>


  

    <!-- plantilla fila inventario-->
    <template id="template-fila-tabla">
        <tr>
            <td class="col-id"></td>
            <td class="col-nombre"></td>
            <td class="col-precio"></td>
            <td class="col-stock text-stock"></td>
            <td class="text-center">
                <a href="#modalEditar" class="col-btn-editar btn-accion">Editar</a>
            </td>
        </tr>
    </template>

    <!-- plantilla editar-->
    <template id="template-modal-editar">
        <div class="modal-overlay admin-modal-overlay" id="">
            <div class="modal-content">
                <a href="#" class="btn-cerrar-modal">&times;</a>
                
                <h2 class="modal-titulo">Editar Producto</h2>
                
                <form class="form-admin form-admin-sin-margen">
                    <label>
                        Nombre del Producto:
                        <input type="text" class="input-edit-nombre" required>
                    </label>

                    <label>
                        Categoría:
                        <select class="select-edit-categoria" required>
                            <option value="1">Suplementos</option>
                            <option value="2">Accesorios</option>
                        </select>
                    </label>

                    <label>
                        Precio de Venta ($):
                        <input type="number" class="input-edit-precio" step="0.01" required>
                    </label>

                    <label>
                        Stock:
                        <input type="number" class="input-edit-stock" min="0" required>
                    </label>

                    <div class="mt-15">
                        <button type="submit" class="btn-primary">Guardar Cambios</button>
                        <a href="#" class="btn-secundario">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </template>

</body>
</html>
