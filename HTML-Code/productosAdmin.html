<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Catálogo</title>
    <link rel="stylesheet" href="../CSS-Code/productos.css">
</head>
<body>

    <div class="app-shell">
        <aside class="sidebar">
            <a href="#" class="brand">
                <img src="../Recursos/Img_sis/LogoWarriors.svg" alt="Gym Warriors Logo">
            </a>
            <span class="sidebar-label">MENÚ PRINCIPAL</span>
            <nav class="main-nav">
                
                <a href="#" class="active">Catálogo / Inventario</a>
            </nav>
            <a href="#" class="logout">Cerrar Sesión</a>
        </aside>

        <div class="main-content">
            <header class="topbar">
                <h1><span></span> Panel de Administración</h1>
                <div class="profile">
                    <strong></strong>
                    <span></span>
                </div>
            </header>

            <div class="content-wrap">
                <div class="admin-container" style="max-width: 100%; margin: 0; background: transparent; border: none; padding: 0;">
                    
                    <div class="page-heading">
                        <span class="eyebrow">INVENTARIO Y PRODUCTOS</span>
                        <h1>Gestión de Catálogo</h1>
                        <p>Agrega, modifica o supervisa los productos y existencias actuales.</p>
                    </div>

                    <form action="../PHP-Code/AgregarProducto.php" class="form-admin card" id="formulario-producto" method="post" enctype="multipart/form-data" style="margin-bottom: 30px;">
                        <p class="form-section-title" style="color: var(--lime); font-family: 'Barlow Condensed', sans-serif; font-size: 20px; margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 8px;">1. Registrar Nuevo Producto</p>

                        <label>
                            Nombre del Producto:
                            <input type="text" required placeholder="Ej. Proteína" id="nombre" name="nombre">
                        </label>

                        <label>
                            Proveedor que reparte:
                            <select required id="selectproveedor" name="id_poveedor">
                                <option value="">Cargando proveedores...</option>
                            </select>
                        </label>

                        <label>
                            Categoría:
                            <select required id="selectCategoriaRegistro" name="id_categoria">
                                <option value="">Cargando categorías...</option>
                            </select>
                        </label>

                        <label>
                            Descripción del producto:
                            <input type="text" placeholder="Peso de 2 kilog, Sabor vainilla" id="descripcion" name="descripcion">
                        </label>

                        <label>
                            Precio de compra ($):
                            <input type="number" step="1.00" required placeholder="0.00" name="precio_compra">
                        </label>

                        <label>
                            Precio de Venta ($):
                            <input type="number" step="1.00" required placeholder="0.00" name="precio_venta">
                        </label>

                        <label class="full-width">
                            Stock Inicial:
                            <input type="number" min="0" required placeholder="Cantidad" name="stock">
                        </label>

                        <div class="fila-inputs-img full-width" style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                            <label>
                                URL de la imagen
                                <input type="url" id="product-imagen-archivo" name="imagen_url">
                            </label>

                            <label>
                                Seleccionar desde dispositivo
                                <input type="file" id="product-imagen-url" name="imagen_archivo" accept="image/*">
                            </label>
                        </div>

                        <button type="submit" class="primary-button mt-10" id="guargarProducto" style="grid-column: span 2; width: 100%;">Guardar Producto</button>
                    </form>

                    <div class="tabla-contenedor card"> 
                        <p class="form-section-title" style="margin-top: 0; margin-bottom: 15px; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; color: var(--lime); border-bottom: 1px solid var(--border); padding-bottom: 8px;">2. Inventario Actual</p>
                        <div class="table-wrapper">
                            <table class="tabla-admin">
                               <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Nombre</th>
                                        <th>P. Venta</th>
                                        <th>Stock</th>
                                        <th class="text-center">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla-contenedor">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../SCRIPT-Code/editaCatalogo.js"></script>

    <div class="modal-overlay" id="modalEditarOverlay">
        <div class="modal-content" id="modalEditar">
        </div>
    </div>

    <template id="template-fila-tabla">
        <tr>
            <td class="col-id"></td>
            <td class="col-nombre"></td>
            <td class="col-precio"></td>
            <td class="col-stock text-stock"></td>
            <td class="text-center">
                <a href="#modalEditar" class="col-btn-editar btn-accion icon-button">Editar</a>
            </td>
        </tr>
    </template>

    <template id="template-modal-editar">
        <div class="modal-overlay admin-modal-overlay">
            <div class="modal-content">
                <a href="#" class="btn-cerrar-modal">&times;</a>
                
                <h2 class="modal-titulo">Editar Producto</h2>
                
                <form class="form-admin form-admin-sin-margen">
                    <label>
                        Nombre del Producto:
                        <input type="text" class="input-edit-nombre" required>
                    </label>

                    <label>
                        Categoría:
                        <select class="select-edit-categoria" required>
                            <option value="1">Suplementos</option>
                            <option value="2">Accesorios</option>
                        </select>
                    </label>

                    <label>
                        Precio de Venta ($):
                        <input type="number" class="input-edit-precio" step="0.01" required>
                    </label>

                    <label>
                        Stock:
                        <input type="number" class="input-edit-stock" min="0" required>
                    </label>

                    <div class="mt-15" style="display: flex; gap: 10px; justify-content: flex-end;">
                        <button type="submit" class="primary-button">Guardar Cambios</button>
                        <a href="#" class="secondary-button" style="display: inline-flex; align-items: center;">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </template>

</body>
</html>
