<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Catálogo</title>
    <link rel="stylesheet" href="../CSS-Code/productos.css">
</head>
<body>

    <div class="admin-container">
        
        <h1 class="admin-titulo">PANEL DE ADMINISTRACIÓN</h1>
        <p class="admin-subtitulo">Gestión de Inventario y Productos</p>

        <form class="form-admin">
            <p class="form-section-title">1. Registrar Nuevo Producto</p>

            <label>
                Nombre del Producto:
                <input type="text" required placeholder="Ej. Proteína 2kg">
            </label>

            <label>
                Categoría:
                <select required>
                    <option value="">Seleccione una categoría</option>
                    <option value="1">Suplementos</option>
                    <option value="2">Accesorios</option>
                </select>
            </label>

            <label>
                Precio de Venta ($):
                <input type="number" step="0.01" required placeholder="0.00">
            </label>

            <label>
                Stock Inicial:
                <input type="number" min="0" required placeholder="Cantidad">
            </label>

            <button type="submit" class="btn-primary mt-10">Guardar Producto</button>
        </form>

        <div class="tabla-contenedor">
            <p class="form-section-title" style="margin-bottom: 15px; font-size: 15px;">2. Inventario Actual</p>
            <table class="tabla-admin">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>P. Venta</th>
                        <th>Stock</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Proteína 2kg</td>
                        <td>$1,250.00</td>
                        <td class="text-stock">15</td>
                        <td class="text-center">
                            <a href="#modalEditar" class="btn-accion">Editar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <div class="modal-overlay" id="modalEditar">
        <div class="modal-content">
            <a href="#" class="btn-cerrar-modal">&times;</a>
            
            <h2 class="modal-titulo">Editar Producto</h2>
            
            <form class="form-admin form-admin-sin-margen">
                <label>
                    Nombre del Producto:
                    <input type="text" value="Proteína Whey 2kg" required>
                </label>

                <label>
                    Categoría:
                    <select required>
                        <option value="1" selected>Suplementos</option>
                        <option value="2">Accesorios</option>
                    </select>
                </label>

                <label>
                    Precio de Venta ($):
                    <input type="number" value="1250.00" step="0.01" required>
                </label>

                <label>
                    Stock:
                    <input type="number" value="15" min="0" required>
                </label>

                <div class="mt-15">
                    <button type="submit" class="btn-primary">Guardar Cambios</button>
                    <a href="#" class="btn-secundario">Cancelar</a>
                </div>
            </form>
        </div>
    </div>


  

    <!-- plantilla fila inventario-->
    <template id="template-fila-tabla">
        <tr>
            <td class="col-id"></td>
            <td class="col-nombre"></td>
            <td class="col-precio"></td>
            <td class="col-stock text-stock"></td>
            <td class="text-center">
                <a href="#modalEditar" class="col-btn-editar btn-accion">Editar</a>
            </td>
        </tr>
    </template>

    <!-- plantilla editar-->
    <template id="template-modal-editar">
        <div class="modal-overlay admin-modal-overlay" id="">
            <div class="modal-content">
                <a href="#" class="btn-cerrar-modal">&times;</a>
                
                <h2 class="modal-titulo">Editar Producto</h2>
                
                <form class="form-admin form-admin-sin-margen">
                    <label>
                        Nombre del Producto:
                        <input type="text" class="input-edit-nombre" required>
                    </label>

                    <label>
                        Categoría:
                        <select class="select-edit-categoria" required>
                            <option value="1">Suplementos</option>
                            <option value="2">Accesorios</option>
                        </select>
                    </label>

                    <label>
                        Precio de Venta ($):
                        <input type="number" class="input-edit-precio" step="0.01" required>
                    </label>

                    <label>
                        Stock:
                        <input type="number" class="input-edit-stock" min="0" required>
                    </label>

                    <div class="mt-15">
                        <button type="submit" class="btn-primary">Guardar Cambios</button>
                        <a href="#" class="btn-secundario">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </template>

</body>
</html>
