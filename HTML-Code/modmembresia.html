 <!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar membresía</title>
    <link rel="stylesheet" href="../CSS-Code/modmembresia.css">
</head>

<body>
    <main class="modificar-contenedor">
        <header class="encabezado">
            <p class="eyebrow">ADMINISTRACIÓN DE MEMBRESÍAS</p>
            <h1>Modificar membresía</h1>
            <p class="subtitulo">Selecciona una membresía existente y actualiza sus datos.</p>
        </header>

        
            
            <form class="formulario" id="form-modificarMembresia" method="post" enctype="multipart/form-data">
                <fieldset>
                    <legend>Datos de la membresía</legend>
                    <input type="hidden" id="id_membresia" name="id_membresia">

                    <div class="fila">
                        <div class="campo">
                            <label for="nombre_tipo">Nombre del tipo de membresía</label>
                            <input type="text" id="nombre_tipo" name="nombre_tipo" maxlength="20" required>
                        </div>
                        <div class="campo">
                            <label for="precio">Precio de la membresía</label>
                            <div class="entrada-con-prefijo">
                                <span>$</span>
                                <input type="number" id="precio" name="precio" min="0" step="0.01" required>
                            </div>
                        </div>
                    </div>

                    <div class="fila">
                        <div class="campo">
                            <label for="duracion_dias">Días de duración</label>
                            <input type="number" id="duracion_dias" name="duracion_dias" min="1" step="1" required>
                        </div>
                        <div class="campo">
                            <label for="incluye_rutina">¿Incluye rutina personalizada?</label>
                            <select id="incluye_rutina" name="incluye_rutina" required>
                                <option value="0">No</option>
                                <option value="1">Sí</option>
                            </select>
                        </div>
                    </div>

                    <div class="campo">
                        <label for="incluye_dieta">¿Incluye dieta y suplementos?</label>
                        <select id="incluye_dieta" name="incluye_dieta" required>
                            <option value="0">No</option>
                            <option value="1">Sí</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="caracteristicas">Características adicionales</label>
                        <textarea id="caracteristicas" name="caracteristicas" maxlength="200" rows="4" placeholder="Describe los beneficios de la membresía"></textarea>
                        <span class="contador"><span id="caracteres">0</span>/200</span>
                    </div>

                    <div class="acciones">
                        <button type="button" id="cancelar" class="boton boton-secundario">Cancelar</button>
                        <button type="submit" class="boton boton-principal">Guardar cambios</button>
                    </div>
                </fieldset>
            </form>
        </section>
    </main>
    <script src="../SCRIPT-Code/modificarMembresia.js"></script>
</body>

</html>
