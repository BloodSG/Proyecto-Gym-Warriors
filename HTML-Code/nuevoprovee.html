    <div class="formulario">

            <img src="../Recursos/Img_sis/LogoWarriors.svg" alt="Fitness Warriors">
        </div>
        <h1>Nuevo proveedor</h1>
        <p>Añade nuevo proveedor</p>
        <form id="formProveedor">
            <label for="nombreemp">Nombre de la empresa</label>
            <br>
            <input type="text" id="nombreemp" name="nombreemp" required>
            <br>
            <label for="nombre">Nombre de contacto</label>
            <br>
            <input type="text" id="nombre" name="nombre" required>
            <br>
            <label for="telefono">Teléfono</label>
            <br>
            <input type="tel" id="telefono" name="telefono" pattern="[0-9]{10}" required>
            <br>
            <label for="correo">Correo electrónico</label>
            <br>
            <input type="email" id="correo" name="correo" required>
            <br>

            <button type="button" onclick="window.location.href='../HTML-Code/proveedores.html'">Cancelar</button>
            <button type="submit">Confirmar y guardar</button>
        </form>
    </div>

    <div id="mensaje" class="mensaje"></div>
