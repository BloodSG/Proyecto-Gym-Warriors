<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Proveedores</title>
    <link rel="stylesheet" href="../CSS-Code/proveedores.css">
    
</head>
<body>
        
<aside class="sidebar">
    <a class="brand" href="admin.html">
        <img src="../Recursos/Img_sis/LogoWarriors.svg" alt="Fitness Warriors">
    </a>

    <p class="sidebar-label">Administración</p>

    <nav class="main-nav">
        <a href="admin.html#inicio">Inicio</a>
        <a href="admin.html#empleados">Empleados</a>
        <a href="admin.html#proveedores" class="active">Proveedores</a>
        <a href="admin.html#productos">Productos</a>
        <a href="admin.html#clientes">Clientes</a>
        <a href="admin.html#ventas">Ventas</a>
        <a href="admin.html#rutinas">Rutinas</a>
        <a href="admin.html#membresias">Membresías</a>
        <a href="admin.html#corte-caja">Corte de caja</a>
    </nav>

    <a class="logout" href="loginmaqueta%20(1).html">Cerrar sesión</a>
</aside>
    <div class="tabla">
        <div class="logo">
            <img src="../Recursos/Img_sis/LogoWarriors.svg" alt="Fitness Warriors">
        </div>
        <h1>Proveedores registrados</h1>
        <button type="button" onclick="location.href='nuevoprovee.html'">+ Agregar a un nuevo proveedor</button>
           
        <table>
            <thead>
                <tr><!--fila-->
                    <th>Nombre empresa</th>
                    <th>Nombre de contacto</th><!--encabezado-->
                    <th>Teléfono</th>
                    <th>Correo electrónico</th>
                    
                </tr>
            </thead>
        <tbody id="tablaProveedores">
           
        </tbody>
        </table>

    </div>

    <script>

    fetch("../PHP-Code/mostrar_proveedor.php")
    .then(respuesta => respuesta.json())
    .then(proveedores => {

        console.log("Datos recibidos:", proveedores);

        let filas = "";

        proveedores.forEach(function(proveedor){

            filas += `
            <tr>
                <td>${proveedor.nombre_empresa}</td>
                <td>${proveedor.contacto_nombre}</td>
                <td>${proveedor.telefono}</td>
                <td>${proveedor.correo}</td>
            </tr>
            `;

        });


        document.querySelector("#tablaProveedores").innerHTML = filas;

    })
    .catch(error => console.log(error));

    </script>

</body>
</html>
