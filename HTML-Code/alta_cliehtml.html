<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crea perfil</title>
    <link rel="stylesheet" href="../CSS-Code/alta_cliecss.css">
    
</head>
<body>
    

    <div class="formulario">
        <div class="logo">
            <img src="../Recursos/Img_sis/LogoWarriors.svg" alt="Fitness Warriors">
        </div>
        <h1>Crea perfil</h1>
        <p>Crea un nuevo perfil para un cliente en el sistema. (solo puedes crear uno si ya estas dado de alta)</p>
        <form action="../PHP-Code/guardar.php" method="POST">
            <label for="nombre">Nombre completo</label>
            <br>
            <input type="text" id="nombre" name="nombre" maxlength="30" pattern="[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+([ '-][A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+)*" title="Usa solo letras, espacios, apóstrofes o guiones" required>
            <br>

            <label for="correo">Correo electrónico</label>
            <br>
            <input type="email" id="correo" name="correo" maxlength="50" autocomplete="email" required>
            <br>

            <label for="password">Contraseña (10 caracteres)</label>
            <br>
            <input type="password" id="password" name="contraseña" minlength="10" maxlength="10" autocomplete="new-password" required>
            <br>
            <label>Confirmar contraseña</label>
            <br>
            
            <input type="password" id="confirmar" name="confirmar" minlength="10" maxlength="10" autocomplete="new-password" required>
            <button type="submit">Confirmar y guardar</button>
        </form>
        <p class="abajo">
            ¿Ya tiene cuenta?
            <a href="loginView.html">Ir a iniciar sesión</a>
        </p>
    </div>
</body>
</html>
