<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Alta de cliente</title>
    <link rel="stylesheet" href="../CSS/alta_cliecss.css">
    
</head>
<body>
    <div class="formulario">
        <div class="logo">
            <img src=../Recursos/LogoWarriors.svg alt="Fitness Warriors">
        </div>
        <h1>Alta de cliente</h1>
        <p>Crea el acceso del nuevo cliente al sistema.</p>
        <form action="../PHP-Code/guardar.php" method="post"> 
            <label>Nombre completo</label>
            <br>
            <input type="text" id="nombre" name="nombre" value="">
            <br>
            
            <label>Correo</label>
            <br>
            <input type="email" id="email" name="correo" value="">
            <br>

            <label>Contraseña</label>
            <br>
            <input type="password" id="password" name="contraseña" value="">
            <br>
            <label>Confirmar contraseña</label>
            <br>
            
            <input type="password" id="confirmar" name="confirmar" value="">
            <button>Confirmar y guardar</button>
        </form>
        <p class="abajo">
            ¿Ya tiene cuenta?
            <a>Ir a iniciar sesion</a>
        </p>
    </div>
</body>
</html>
