<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Alta de cliente</title>
    <link rel="stylesheet" href="../CSS-Code/alta_cliecss.css">
    
</head>
<body>
    
<aside class="sidebar">
    <a class="brand" href="admin.html">
        <img src="../Recursos/LogoWarriors.svg" alt="Fitness Warriors">
    </a>

    <p class="sidebar-label">Administración</p>

    <nav class="main-nav">
        <a href="admin.html#inicio">Inicio</a>
        <a href="admin.html#empleados">Empleados</a>
        <a href="admin.html#proveedores">Proveedores</a>
        <a href="admin.html#productos">Productos</a>
        <a href="admin.html#clientes" class="active">Clientes</a>
        <a href="admin.html#ventas">Ventas</a>
        <a href="admin.html#rutinas">Rutinas</a>
        <a href="admin.html#membresias">Membresías</a>
        <a href="admin.html#corte-caja">Corte de caja</a>
    </nav>

    <a class="logout" href="loginView.html">Cerrar sesión</a>
</aside>
    <div class="formulario">
        <div class="logo">
            <img src="../Recursos/LogoWarriors.svg" alt="Fitness Warriors">
        </div>
        <h1>Alta de cliente</h1>
        <p>Crea el acceso del nuevo cliente al sistema.</p>
        <form action="../PHP-Code/guardar.php" method="POST">
            <label for="nombre">Nombre(s)</label>
            <br>
            <input type="text" id="nombre" name="nombre" maxlength="30" pattern="[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+([ '-][A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+)*" title="Usa solo letras, espacios, apóstrofes o guiones" autocomplete="given-name" required>
            <br>

            <label for="apellido_1">Primer apellido</label>
            <br>
            <input type="text" id="apellido_1" name="apellido_1" maxlength="10" pattern="[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+([ '-][A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+)*" title="Usa solo letras, espacios, apóstrofes o guiones" autocomplete="family-name" required>
            <br>

            <label for="apellido_2">Segundo apellido (opcional)</label>
            <br>
            <input type="text" id="apellido_2" name="apellido_2" maxlength="10" pattern="[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+([ '-][A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+)*" title="Usa solo letras, espacios, apóstrofes o guiones">
            <br>

            <label for="correo">Correo electrónico</label>
            <br>
            <input type="email" id="correo" name="correo" maxlength="50" autocomplete="email" required>
            <br>

            <label for="password">Contraseña (10 caracteres)</label>
            <br>
            <input type="password" id="password" name="contraseña" minlength="10" maxlength="10" autocomplete="new-password" required>
            <br>
            <label for="confirmar">Confirmar contraseña</label>
            <br>
            
            <input type="password" id="confirmar" name="confirmar" minlength="10" maxlength="10" autocomplete="new-password" required>
            <button type="submit">Confirmar y guardar</button>
        </form>
        <p class="abajo">
            ¿Ya tiene cuenta?
            <a href="loginView.html">Ir a iniciar sesión</a>
        </p>
    </div>
</body>
</html>
