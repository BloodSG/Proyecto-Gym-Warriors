        <div class="logo">

        <h1>Alta de cliente</h1>
        <p>Crea el acceso del nuevo cliente al sistema.</p>
        <form action="../PHP-Code/guardar.php" method="POST">
            <label>Nombre completo</label>
            <br>
            <input type="text" id="nombre" name="nombre">
            <br>

            <label for="correo">Correo electrónico</label>
            <br>
            <input type="email" id="correo" name="correo" required>
            <br>

            <label>Contraseña</label>
            <br>
            <input type="password" id="password" name="contraseña" >
            <br>
            <label>Confirmar contraseña</label>
            <br>
            
            <input type="password" id="confirmar" name="confirmar" >
            <button type="submit">Confirmar y guardar</button>
        </form>
        <p class="abajo">
            ¿Ya tiene cuenta?
            <a>Ir a iniciar sesión</a>
        </p>
