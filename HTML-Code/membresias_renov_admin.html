    <dialog id="modalRenovar" class="modal_dialog">
        <div class="modal_contenido">
            <div class="modal_header">
                <h2>Gestión de membresía</h2>
                <button type="button" onclick="cerrarModal('modalRenovar')">&times;</button>
            </div>
            <form method="POST" action="" class="form_modal">
                <div class="grupo_form">
                    <label>Miembro seleccionado:</label>
                    <p><strong><!-- Nombre del Miembro y ID --></strong></p>
                </div>

                <div class="grupo_form">
                    <label for="tipo_membresia">Seleccionar nuevo plan / Renovación *</label>
                    <select id="tipo_membresia" name="tipo_membresia" required>
                        <option value="1"> Escudo básico </option>
                        <option value="2"> Guerrero combat </option>
                        <option value="3"> Élite warrior </option>
                        <option value="4"> VIP legend </option>
                        <option value="5"> Clase individual </option>
                    </select>
                </div>

                <div class="fila_form">
                    <div class="grupo_form">
                        <label for="metodo_pago">Método de pago</label>
                        <select id="metodo_pago" name="metodo_pago">
                            <option value="Efectivo">Efectivo</option>
                            <option value="Tarjeta">Tarjeta</option>
                            <option value="Transferencia">Transferencia</option>
                        </select>
                    </div>
                    <div class="grupo_form">
                        <label for="monto">Monto ($)</label>
                        <input type="text" inputmode="decimal" id="monto" name="monto" placeholder="Ej. 500.00">
                    </div>
                </div>

                <div class="modal_acciones">
                    <button type="button" onclick="cerrarModal('modalRenovar')">Cerrar</button>
                    <button type="submit">Aplicar cambios</button>
                </div>
            </form>
        </div>
    </dialog>

    <script>
        function abrirModal(idModal) {
            const modal = document.getElementById(idModal);
            if (modal) modal.showModal();
        }

        function cerrarModal(idModal) {
            const modal = document.getElementById(idModal);
            if (modal) modal.close();
        }

        function confirmarCancelacion() {
            if (confirm("¿Estás segura de que deseas cancelar la membresía de este miembro?")) {
            }
        }
    </script>
</body>
