<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empleados</title>
</head>

<body>
    <header>
        <h1>Empleados</h1>
        <nav aria-label="Navegación principal">
            <a href="admin.html">Inicio</a>
            <a href="empleados.html">Empleados</a>
            <a href="admin.html#proveedores">Proveedores</a>
            <a href="admin.html#productos">Productos</a>
            <a href="admin.html#clientes">Clientes</a>
            <a href="admin.html#ventas">Ventas</a>
            <a href="admin.html#rutinas">Rutinas</a>
            <a href="admin.html#membresias">Membresías</a>
            <a href="admin.html#corte-caja">Corte de caja</a>
        </nav>
    </header>

    <main>
        <h2>Registrar empleado</h2>

        <form>
            <p>
                <label for="nombres">Nombre/s</label><br>
                <input type="text" id="nombres" name="nombres" required>
            </p>
            <p>
                <label for="apellido-1">Primer apellido</label><br>
                <input type="text" id="apellido-1" name="apellido_1" required>
            </p>
            <p>
                <label for="apellido-2">Segundo apellido</label><br>
                <input type="text" id="apellido-2" name="apellido_2" required>
            </p>
            <p>
                <label for="curp">CURP</label><br>
                <input type="text" id="curp" name="curp" maxlength="18" required>
            </p>
            <p>
                <label for="rfc">RFC</label><br>
                <input type="text" id="rfc" name="rfc" maxlength="13">
            </p>
            <p>
                <label for="puesto">Puesto</label><br>
                <input type="text" id="puesto" name="puesto" maxlength="30" required>
            </p>
            <p>
                <label for="turno">Turno</label><br>
                <input type="text" id="turno" name="turno" maxlength="20" required>
            </p>
            <p>
                <label for="salario">Salario</label><br>
                <input type="number" id="salario" name="salario" min="0.01" step="0.01" required>
            </p>
            <p>
                <label for="fecha-contratacion">Fecha de contratación</label><br>
                <input type="date" id="fecha-contratacion" name="fecha_contratacion">
            </p>
            <p>
                <label for="estado-laboral">Estado laboral</label><br>
                <select id="estado-laboral" name="estado_laboral">
                    <option value="activo" selected>Activo</option>
                    <option value="vacaciones">Vacaciones</option>
                    <option value="inactivo">Inactivo</option>
                </select>
            </p>
            <p>
                <label for="contacto-emergencia-nom">Nombre del contacto de emergencia</label><br>
                <input type="text" id="contacto-emergencia-nom" name="contacto_emergencia_nom" maxlength="50">
            </p>
            <p>
                <label for="contacto-emergencia-tel">Teléfono del contacto de emergencia</label><br>
                <input type="tel" id="contacto-emergencia-tel" name="contacto_emergencia_tel" maxlength="10">
            </p>
            <button type="submit">Guardar empleado</button>
        </form>
