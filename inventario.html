
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario </title>
    <link rel="stylesheet" href="inventario_css/inventario.css">
</head>
<body>

    <main class="inventario-container">

        <header class="inventario_header">
            <h1 class="inventario_titulo">INVENTARIO</h1>
            <p class="inventario_subtitulo">
                Consulta y monitoreo de existencias
            </p>
        </header>

        <section class="inventario_resumen">

            <article class="tarjeta_total">
                <h2 class="tarjeta_titulo_total">
                    Total de productos
                </h2>
                <p class="tarjeta_valor_total">
                    <!-- PHP -->
                </p>
            </article>

            <article class="tarjeta_stock_bajo">
                <h2 class="tarjeta_titulo_stock_bajo">
                    Stock bajo
                </h2>
                <p class="tarjeta_valor_stock_bajo">
                    <!-- PHP -->
                </p>
            </article>

            <article class="tarjeta_agotados">
                <h2 class="tarjeta_titulo_agotados">
                    Productos agotados
                </h2>
                <p class="tarjeta_valor_agotados">
                    <!-- PHP -->
                </p>
            </article>

        </section>

        <!-- Alertas -->
        <section class="alertas">
            <h2 class="titulo">Alertas de existencias</h2>

            <div class="lista_alertas">
                <!-- PHP -->
            </div>
        </section>

        <!-- Consulta de los productos en existencia -->
        <section class="consulta">
            <h2 class="titulo">Existencias actuales</h2>

            <!-- Búsqueda de productos -->
            <form class="busqueda" method="GET" action="">
                <label for="buscador">
                    Buscar producto:
                </label>

                <input
                    type="search"
                    id="buscador"
                    name="buscar"
                    placeholder="Nombre del producto"
                >

                <button type="submit" class="btn-buscar">
                    Buscar
                </button>
            </form>

            <!-- Tabla de inventario -->
            <div class="tabla-contenedor">
                <table class="tabla-inventario">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre del producto</th>
                            <th>Categoría</th>
                            <th>Descripción</th>
                            <th>Precio de compra</th>
                            <th>Precio de venta</th>
                            <th>Proveedor</th>
                            <th>Stock</th>
                        </tr>
                    </thead>

                    <tbody>
                        <!-- PHP-->
                    </tbody>

                </table>
            </div>

        </section>

    </main>

</body>
</html>
