<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="tarjeta-login">
        <img class="logo" src="LogoWarriors.svg" alt="Logo Fitness Warriors">
        <h2>Iniciar sesión</h2>
        <p class="subtexto">Ingresa tus datos para acceder al sistema.</p>

        <div class="roles" aria-label="Tipo de usuario">
            <button type="button" class="rol activo" aria-pressed="true">Cliente</button>
            <button type="button" class="rol" aria-pressed="false">Administrador</button>
            <button type="button" class="rol" aria-pressed="false">Empleado</button>
        </div>

        <form action="validacion.php" method="POST">
            <div class="campo">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" autocomplete="username" placeholder="Ingresa tu usuario">
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••">
            </div>

            <div class="fila-opciones">
                <label>
          <input type="checkbox" id="recordar">
          Recordarme
        </label>
                <a href="#">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" name="accion" value="login" class="btn-ingresar">Ingresar</button>
        </form>

        <p class="pie-registro">¿No tienes cuenta? <a href="#">Solicítala aquí</a></p>
    </div>

</body>

</html>
